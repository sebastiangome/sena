<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>{% block titulo %}SENA{% endblock %} · SENA</title>
<style>
  :root {
    --bg: #f5f5f0; --card: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #0f766e; --accent-soft: #ccfbf1; --ingreso: #15803d; --gasto: #b91c1c;
    --warn: #b45309; --warn-soft: #fef3c7; --bad-soft: #fee2e2; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12110f; --card: #1c1b19; --text: #f5f5f4; --muted: #a8a29e; --line: #2e2c29;
      --accent: #2dd4bf; --accent-soft: #134e4a; --ingreso: #4ade80; --gasto: #f87171;
      --warn: #fbbf24; --warn-soft: #422006; --bad-soft: #450a0a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; }
  a { color: var(--accent); text-decoration: none; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .barra { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font-weight: 800; letter-spacing: .08em; font-size: 1.15rem; color: var(--text); }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav a { padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: .9rem; white-space: nowrap; }
  nav a.activo, nav a:hover { background: var(--accent-soft); color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  h1 { font-size: 1.35rem; margin: 4px 0 14px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: .88rem; }
  @media (max-width: 600px) {
    .barra { flex-wrap: wrap; padding-bottom: 8px; }
    nav { width: 100%; flex-wrap: wrap; justify-content: space-between; }
    nav a { padding: 6px 8px; font-size: .85rem; }
  }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi .valor { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ingreso { color: var(--ingreso); } .gasto { color: var(--gasto); }
  .btn { display: inline-block; border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn { color: #042f2e; } }
  .btn.sec { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn.peligro { background: transparent; color: var(--gasto); border: 1px solid var(--line); padding: 6px 10px; font-size: .85rem; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .mesnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .mesnav a { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  ul.lista { list-style: none; margin: 0; padding: 0; }
  ul.lista li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  ul.lista li:last-child { border-bottom: 0; }
  .monto { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .alerta { padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: .92rem; }
  .alerta.cerca { background: var(--warn-soft); color: var(--warn); }
  .alerta.excedido { background: var(--bad-soft); color: var(--gasto); }
  .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; background: var(--accent-soft); color: var(--accent); }
  .msg.error { background: var(--bad-soft); color: var(--gasto); }
  .barra-prog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .barra-prog div { height: 100%; background: var(--accent); }
  .barra-prog .cerca { background: var(--warn); } .barra-prog .excedido { background: var(--gasto); }
  form p { margin: 0 0 12px; }
  form label { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--bg); color: var(--text); }
  .helptext, .errorlist { font-size: .8rem; color: var(--muted); }
  .errorlist { color: var(--gasto); padding-left: 16px; margin: 4px 0; }
  .vacio { text-align: center; padding: 24px 8px; color: var(--muted); }
  .auth { max-width: 400px; margin: 30px auto; }
  @media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 .kpi:last-child { grid-column: span 2; } }
</style>
</head>
<body>
<header>
  <div class="barra">
    <a href="{% url 'dashboard' %}" class="logo">SE<span>NA</span></a>
    {% if user.is_authenticated %}
    <nav>
      {% with n=request.resolver_match.url_name %}
      <a href="{% url 'dashboard' %}" class="{% if n == 'dashboard' %}activo{% endif %}">Resumen</a>
      <a href="{% url 'movimientos' %}" class="{% if 'movimiento' in n %}activo{% endif %}">Movimientos</a>
      <a href="{% url 'presupuestos' %}" class="{% if 'presupuesto' in n %}activo{% endif %}">Presupuestos</a>
      <a href="{% url 'metas' %}" class="{% if 'meta' in n %}activo{% endif %}">Metas</a>
      <a href="{% url 'categorias' %}" class="{% if 'categoria' in n %}activo{% endif %}">Categorías</a>
      {% endwith %}
      <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="btn sec" style="padding:6px 10px;font-size:.85rem">Salir</button></form>
    </nav>
    {% endif %}
  </div>
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block contenido %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}
<div class="auth">
  <h1>Establecer nueva contraseña</h1>
  <p class="muted">Ingresa el correo registrado, el código recibido y tu nueva contraseña.</p>
  <div class="card">
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn" style="width:100%">Cambiar contraseña</button>
    </form>
  </div>
  <p class="muted"><a href="{% url 'password_reset_request' %}">Solicitar otro código</a></p>
</div>
{% endblock %}
